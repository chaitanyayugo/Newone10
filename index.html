<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Scroll</title>
    
    <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --bg-color: #0b1120;
            --floor-color: #1e293b;
            --grid-line: rgba(148, 163, 184, 0.1);
            --desk: #334155;
            --monitor-bg: #000;
            --monitor-glow: #38bdf8;
            --char-primary: #38bdf8;
            --char-secondary: #2563eb;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: #fff;
            overflow-x: hidden;
            font-family: system-ui, sans-serif;
        }

        .scroll-buffer {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            font-size: 1.5rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            opacity: 0.4;
        }

        #hero-scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(30,41,59,0.8) 0%, var(--bg-color) 80%);
            perspective: 1400px;
        }

        .perspective-anchor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            perspective-origin: 50% 100%;
        }

        .floor {
            position: absolute;
            bottom: -50vh;
            left: -50vw;
            width: 200vw;
            height: 120vh;
            background: 
                linear-gradient(var(--bg-color) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 60px, var(--grid-line) 60px, var(--grid-line) 62px),
                repeating-linear-gradient(90deg, transparent, transparent 60px, var(--grid-line) 60px, var(--grid-line) 62px);
            transform: rotateX(75deg);
            transform-origin: bottom center;
        }

        .stage-wrapper {
            position: absolute;
            bottom: 15vh;
            left: 45vw;
            width: 10px;
            height: 10px;
            transform-style: preserve-3d;
        }

        .desk {
            position: absolute;
            bottom: 0;
            left: -40px;
            width: 320px;
            height: 180px;
        }

        .desk-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 24px;
            background: #475569;
            border-bottom: 6px solid #1e2533;
            border-right: 18px solid #3b4b60;
            border-radius: 4px;
        }

        .desk-leg {
            position: absolute;
            top: 24px;
            width: 20px;
            height: 156px;
            background: #1e2533;
        }
        .desk-leg.right { right: 30px; }
        .desk-leg.left { left: 20px; }

        .monitor {
            position: absolute;
            bottom: 165px;
            left: 60px;
            width: 160px;
            height: 100px;
            background: var(--monitor-bg);
            border: 6px solid #64748b;
            border-radius: 8px;
            box-shadow: 12px 15px 40px rgba(56, 189, 248, 0.25);
            transform: perspective(400px) rotateY(12deg);
            overflow: hidden;
        }
        
        .monitor-code {
            position: absolute;
            top: 10px;
            left: 15px;
            width: 60%;
            height: 4px;
            background: var(--monitor-glow);
            box-shadow: 0 10px 0 var(--monitor-glow), 0 20px 0 rgba(56,189,248,0.4), 0 30px 0 rgba(56,189,248,0.8);
            border-radius: 4px;
        }

        .chair {
            position: absolute;
            bottom: 0;
            left: -180px;
            width: 120px;
            height: 140px;
            z-index: 20;
        }
        
        .chair-cushion {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100px;
            height: 22px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        
        .chair-backrest {
            position: absolute;
            bottom: 70px;
            left: 5px;
            width: 25px;
            height: 100px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #1e293b;
            transform: perspective(400px) rotateY(-18deg);
        }

        .chair-base {
            position: absolute;
            bottom: 0;
            left: 45px;
            width: 14px;
            height: 60px;
            background: #475569;
        }

        #actor {
            position: absolute;
            bottom: 12vh;
            left: 100vw;
            width: 200px;
            height: 280px;
            z-index: 15;
            transform-origin: center bottom;
            will-change: transform;
        }

        .actor-state {
            position: absolute;
            inset: 0;
            visibility: hidden;
            opacity: 0;
        }

        .actor-state svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: var(--char-primary);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        
        .actor-state circle {
            fill: var(--char-primary);
            stroke: none;
        }

        .dark-stroke {
            stroke: var(--char-secondary);
        }

        @keyframes swing1 {
            0% { transform: rotate(-30deg); }
            100% { transform: rotate(30deg); }
        }
        @keyframes swing2 {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(-30deg); }
        }
        @keyframes bodymove {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .anim-l1 { transform-origin: 100px 180px; animation: swing1 0.7s infinite alternate linear; }
        .anim-l2 { transform-origin: 100px 180px; animation: swing2 0.7s infinite alternate linear; }
        .anim-body { transform-origin: 100px 280px; animation: bodymove 0.35s infinite alternate ease-in-out; }

    </style>
</head>
<body>

    <section class="scroll-buffer">01 Start Scrolling</section>

    <section id="hero-scene">
        <div class="perspective-anchor">
            <div class="floor"></div>
            <div class="stage-wrapper">
                <div class="chair">
                    <div class="chair-base"></div>
                    <div class="chair-backrest"></div>
                    <div class="chair-cushion"></div>
                </div>
                <div class="desk">
                    <div class="desk-leg left"></div>
                    <div class="desk-leg right"></div>
                    <div class="desk-top"></div>
                    <div class="monitor">
                        <div class="monitor-code"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="actor">
            <div class="actor-state" id="view-walk">
                <svg viewBox="0 0 200 280">
                    <g class="anim-body">
                        <circle cx="100" cy="45" r="28"/>
                        <path d="M 100,75 L 100,180"/>
                        <path class="dark-stroke anim-l1" d="M 100,180 L 120,230 L 150,260"/>
                        <path class="anim-l2" d="M 100,180 L 80,230 L 50,260"/>
                        <path class="dark-stroke anim-l1" d="M 100,90 L 140,140"/>
                        <path class="anim-l2" d="M 100,90 L 60,140"/>
                    </g>
                </svg>
            </div>

            <div class="actor-state" id="view-turn">
                <svg viewBox="0 0 200 280">
                    <circle cx="100" cy="45" r="28"/>
                    <path d="M 100,75 L 100,180"/>
                    <path d="M 100,180 L 80,270"/>
                    <path d="M 100,180 L 120,270"/>
                    <path d="M 100,100 L 65,140"/>
                    <path d="M 100,100 L 135,140" stroke-dasharray="1 8"/>
                </svg>
            </div>

            <div class="actor-state" id="view-sit">
                <svg viewBox="0 0 200 280">
                    <circle cx="110" cy="45" r="28"/>
                    <path d="M 110,75 L 100,180"/>
                    <path d="M 100,180 L 55,180"/>
                    <path class="dark-stroke" d="M 65,180 L 65,270"/>
                    <path d="M 55,180 L 55,270"/>
                    <path d="M 110,100 L 50,115"/>
                    <path d="M 50,115 L 145,110"/>
                </svg>
            </div>
        </div>
    </section>

    <section class="scroll-buffer">02 Scroll Down</section>
    <section class="scroll-buffer">03 Continue View</section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const elWalk = document.getElementById('view-walk');
        const elTurn = document.getElementById('view-turn');
        const elSit = document.getElementById('view-sit');

        gsap.set(elWalk, { autoAlpha: 1 });

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "#hero-scene",
                start: "top top",
                end: "+=350%",
                pin: true,
                scrub: 1,
                fastScrollEnd: true
            }
        });

        tl.to('#actor', { 
            left: 'calc(45vw - 195px)',
            duration: 60, 
            ease: "none"
        }, 0)
        
        .set(elWalk, { autoAlpha: 0 }, 60)
        .set(elTurn, { autoAlpha: 1 }, 60)
        
        .to('#actor', { 
            left: 'calc(45vw - 195px)',
            duration: 20, 
            ease: "none" 
        }, 60)
        
        .set(elTurn, { autoAlpha: 0 }, 80)
        .set(elSit, { autoAlpha: 1 }, 80)
        
        .to('#actor', { 
            y: 35,
            duration: 20, 
            ease: "power1.out" 
        }, 80);

    </script>
</body>

                <div class="chair">
                    <div class="chair-base"></div>

                    <div class="chair-seat"></div>
                </div>

                <div class="desk">
                    <div class="desk-leg l"></div>
                    <div class="desk-leg r"></div>
                    <div class="desk-top"></div>
                    <div class="monitor"></div>
                </div>

                <div id="char">
                    <div class="state" id="state-walk">
                        <svg viewBox="0 0 250 350">
                            <ellipse cx="125" cy="335" rx="20" ry="4" />
                            <g class="bounce">
                                <circle cx="105" cy="115" r="30" />
                                <path d="M 105,165 L 145,215" stroke-dasharray="2, 6"/>
                                <path class="leg-r" d="M 105,245 L 95,295 L 75,325"/>
                                <path d="M 105,145 L 105,245"/>
                                <path class="leg-l" d="M 105,245 L 125,285 L 145,325" stroke="#2563eb" />
                                <path class="arm" d="M 105,165 L 75,215" stroke="#2563eb"/>
                            </g>
                        </svg>
                    </div>

                    <div class="state" id="state-turn">
                        <svg viewBox="0 0 250 350">
                            <ellipse cx="105" cy="335" rx="30" ry="5" />
                            <g>
                                <circle cx="105" cy="115" r="30" />
                                <path d="M 105,145 L 105,245" />
                                <path d="M 105,245 L 85,325" />

                                <path d="M 105,165 L 140,185" stroke-dasharray="2, 6"/>
                            </g>
                        </svg>
                    </div>

                    <div class="state" id="state-sit">
                        <svg viewBox="0 0 250 350">
                            <ellipse cx="85" cy="335" rx="15" ry="4" />
                            <g transform="translate(-20, 0)">
                                <circle cx="105" cy="115" r="30" />
                                <path d="M 105,145 L 90,245"/> 
                                <path d="M 90,245 L 45,245" />
                                <path d="M 45,245 L 45,325" />
                                <path d="M 90,245 L 55,255" stroke="#2563eb" />
                                <path d="M 55,255 L 55,330" stroke="#2563eb" />
                                <path d="M 105,165 L 45,190" stroke="#2563eb" />
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="dummy">Scroll Up</section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const states = [
            document.getElementById('state-walk'),
            document.getElementById('state-turn'),
            document.getElementById('state-sit')
        ];

        gsap.set(states[0], { autoAlpha: 1 });

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "#hero-pin",
                start: "top top",
                end: "+=200vh",
                pin: true,
                scrub: true,
                fastScrollEnd: true
            }
        });

        tl.to('#char', { 
            x: '-70px', 
            ease: "none", 
            duration: 60 
        }, 0)
        
        .set(states[0], { autoAlpha: 0 }, 60)
        .set(states[1], { autoAlpha: 1 }, 60)
        
        .to('#char', { 
            x: '-70px', 
            ease: "none", 
            duration: 20 
        }, 60)
        
        .set(states[1], { autoAlpha: 0 }, 80)
        .set(states[2], { autoAlpha: 1 }, 80)
        
        .to('#char', { 
            y: 40, 
            ease: "power2.out", 
            duration: 20 
        }, 80);
    </script>
</body>
